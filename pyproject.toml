[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resti"
version = "1.0.0"
description = "Save and restore Windows desktop icon layouts."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = ["customtkinter>=5.2"]
classifiers = [
    "Environment :: Win32 (MS Windows)",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Topic :: Desktop Environment",
]

[project.urls]
Homepage = "https://github.com/TinyNity/resti"
Issues = "https://github.com/TinyNity/resti/issues"

[project.gui-scripts]
resti = "resti.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]
